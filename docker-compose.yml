version: '3.9'

services:
  app:
    build: .
    container_name: yt-manajemen-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - APP_URL=${APP_URL}
      - APP_SECRET=${APP_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DATABASE_URL=postgresql://ytuser:${DB_PASSWORD}@db:5432/ytdb
      - DATA_DIR=/data
      - WORKER_ENABLED=${WORKER_ENABLED:-true}
      - WORKER_INTERVAL_MS=${WORKER_INTERVAL_MS:-5000}
      - YOUTUBE_CHUNK_MB=${YOUTUBE_CHUNK_MB:-8}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_AUTO_FALLBACK=${AI_AUTO_FALLBACK:-true}
      - AI_DAILY_LIMIT=${AI_DAILY_LIMIT:-50}
    volumes:
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ytnet

  db:
    image: postgres:16-alpine
    container_name: yt-manajemen-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ytuser
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=ytdb
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytuser -d ytdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ytnet

  nginx:
    image: nginx:alpine
    container_name: yt-manajemen-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - ytnet

volumes:
  app_data:
  pg_data:
  nginx_logs:

networks:
  ytnet:
    driver: bridge
